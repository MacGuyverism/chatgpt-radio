name: Produce ChatGPT Radio broadcast
on:
  workflow_dispatch:
  schedule:
    # 06:15 Eastern: 10:15 UTC during EDT, 11:15 UTC during EST.
    - cron: '15 10 * * *'
    - cron: '15 11 * * *'
permissions:
  contents: read
concurrency:
  group: chatgpt-radio-production
  cancel-in-progress: false
jobs:
  broadcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check Eastern production window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          from zoneinfo import ZoneInfo
          local = datetime.datetime.now(ZoneInfo("America/New_York"))
          scheduled = os.environ["EVENT_NAME"] == "schedule"
          # Select the DST-appropriate cron, even if GitHub starts it late.
          expected = '15 10 * * *' if local.dst() else '15 11 * * *'
          allowed = not scheduled or os.environ.get('EVENT_CRON') == expected
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run=" + str(allowed).lower() + "\n")
          print("Local Eastern time:", local.isoformat())
          print("Proceed with production:", allowed)
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - name: Install FFmpeg with bounded retries
        if: steps.window.outputs.run == 'true'
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg already installed"
          else
            # Try cached package lists first to avoid slow repository refreshes.
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -y -qq ffmpeg || {
              sudo timeout 90 apt-get update -qq -o Acquire::Retries=1
              sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -y -qq ffmpeg
            }
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install article and chapter dependencies
        if: steps.window.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check 'mutagen==1.47.0' 'trafilatura==2.0.0'
      - name: Produce broadcast
        if: steps.window.outputs.run == 'true'
        env:
          RADIO_EVENT: ${{ github.event_name }}
          RADIO_TEST_ONLY: ${{ github.ref_name != 'main' && '1' || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 radio_production.py
      - name: Save test broadcast
        if: success() && steps.window.outputs.run == 'true' && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: radio-test-broadcast
          path: |
            build/chatgpt-radio-*.mp3
            build/chatgpt-radio-*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve completed MP3 for recovery if publishing fails
        if: failure() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recovered-radio-mp3
          path: build/chatgpt-radio-*.mp3
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Save debugging files if failed
        if: failure() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radio-diagnostics
          path: |
            build/sources.json
            build/script.txt
          if-no-files-found: ignore
          retention-days: 2
