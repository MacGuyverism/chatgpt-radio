name: Produce ChatGPT Radio broadcast
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-radio-production
  cancel-in-progress: false
jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Produce broadcast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 radio_production.py
      - name: Preserve completed MP3 for recovery if publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-radio-mp3
          path: build/chatgpt-radio-*.mp3
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Save debugging files if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radio-diagnostics
          path: |
            build/sources.json
            build/script.txt
          if-no-files-found: ignore
          retention-days: 2
