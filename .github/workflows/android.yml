name: Briefsona Android debug
on:
  workflow_dispatch:
  push:
    branches: [feature/article-chapters-reliability]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore persistent test signing key
        if: github.event_name != 'pull_request' && github.ref_name == 'feature/article-chapters-reliability'
        env:
          KEYSTORE: ${{ secrets.BRIEFSONA_DEBUG_KEYSTORE }}
          PASSWORD: ${{ secrets.BRIEFSONA_DEBUG_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" ]]; then
            echo "::error::Configure both Briefsona debug signing secrets before publishing an APK."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/briefsona-debug.p12"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/briefsona-debug-password"
          {
            echo "BRIEFSONA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/briefsona-debug.p12"
            echo "BRIEFSONA_DEBUG_PASSWORD_PATH=$RUNNER_TEMP/briefsona-debug-password"
            echo "BRIEFSONA_DEBUG_BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
      - name: Cache offline reporter samples
        if: github.event_name != 'pull_request' && github.ref_name == 'feature/article-chapters-reliability'
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/reporter-voices
          key: briefsona-reporter-samples-v1
      - name: Prepare offline reporter samples
        if: github.event_name != 'pull_request' && github.ref_name == 'feature/article-chapters-reliability'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install -r requirements.txt
          python radio_preview.py --record-samples android/app/src/main/assets/reporter-voices
      - run: gradle -p android testDebugUnitTest assembleDebug
        env:
          BRIEFSONA_PROJECT_URL: ${{ secrets.SUPABASE_URL }}
          BRIEFSONA_BACKUP_URL: ${{ vars.BRIEFSONA_BACKUP_URL }}
          BRIEFSONA_BACKUP_PUBLISHABLE_KEY: ${{ vars.BRIEFSONA_BACKUP_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref_name == 'feature/article-chapters-reliability'
        with:
          name: briefsona-0.0.31-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest
