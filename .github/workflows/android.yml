name: Briefsona Android debug
on:
  workflow_dispatch:
  push:
    branches: [feature/article-chapters-reliability]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android testDebugUnitTest assembleDebug
        env:
          BRIEFSONA_PROJECT_URL: ${{ secrets.SUPABASE_URL }}
          BRIEFSONA_BACKUP_URL: ${{ vars.BRIEFSONA_BACKUP_URL }}
          BRIEFSONA_BACKUP_PUBLISHABLE_KEY: ${{ vars.BRIEFSONA_BACKUP_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: briefsona-0.0.2-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest
